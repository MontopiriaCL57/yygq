<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日谜题 · yygq面馆</title>
<link rel="stylesheet" href="/assets/theme.css">
<style>
  .pz-head{ text-align:center; margin-bottom:8px; }
  .pz-meta{ color:var(--dim); font-size:.76rem; letter-spacing:.12em; margin-top:6px; }
  .pz-meta b{ color:var(--gold); }
  .pz-tabs{ display:flex; gap:8px; justify-content:center; margin:16px 0 6px; flex-wrap:wrap; }

  .qcard{ position:relative; border:1px solid var(--line); border-radius:12px;
    background:linear-gradient(158deg, var(--panel-1), var(--panel-2));
    padding:16px; margin:16px 0; box-shadow:0 0 22px rgba(0,255,213,.1); }
  .qcard::before{ content:''; position:absolute; left:-1px; top:-1px; width:16px; height:16px;
    border-left:2px solid var(--neon); border-top:2px solid var(--neon); border-top-left-radius:12px; }
  .qcard::after{ content:''; position:absolute; right:-1px; bottom:-1px; width:16px; height:16px;
    border-right:2px solid var(--neon2); border-bottom:2px solid var(--neon2); border-bottom-right-radius:12px; }
  .qcard.pink{ border-color:var(--line-2); box-shadow:0 0 22px rgba(255,0,229,.14); }
  .qcard.done{ border-color:rgba(255,215,0,.55); box-shadow:0 0 26px rgba(255,215,0,.18); }
  .qcard.done::before,.qcard.done::after{ border-color:var(--gold); }
  .q-h{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .q-idx{ font-size:.95rem; color:#fff; letter-spacing:.1em; text-shadow:0 0 10px rgba(0,255,213,.5); }
  .q-body{ margin-bottom:12px; }
  .q-img{ display:block; margin:0 auto; max-width:min(100%,340px); border-radius:10px;
    border:1px solid var(--line); background:#0a0a12; box-shadow:0 0 26px rgba(0,255,213,.18); }
  .q-riddle{ font-size:.95rem; line-height:2; color:#dff; border-left:3px solid var(--neon2);
    padding:12px 15px; border-radius:6px; word-break:break-word;
    background:linear-gradient(135deg, rgba(255,0,229,.09), rgba(139,92,255,.05)); }
  .q-hintbox{ font-size:.82rem; color:var(--gold); margin-top:10px; letter-spacing:.06em; }
  /* 候选点选区（手机友好） */
  .cand-h{ font-size:.7rem; color:var(--dim); letter-spacing:.08em; margin:12px 0 6px; }
  .cand-h b{ color:var(--gold); }
  .cand{ display:flex; flex-wrap:wrap; gap:6px; max-height:168px; overflow-y:auto; padding:8px;
    border:1px solid rgba(0,255,213,.22); border-radius:8px;
    background:linear-gradient(160deg, rgba(0,255,213,.05), rgba(139,92,255,.04)); }
  .cand-b{ font:inherit; font-size:.74rem; letter-spacing:.04em; cursor:pointer; color:#9fe;
    background:rgba(2,8,14,.6); border:1px solid rgba(0,255,213,.35); border-radius:6px;
    padding:6px 11px; transition:.18s; -webkit-tap-highlight-color:transparent; }
  .cand-b:hover{ background:rgba(0,255,213,.2); color:#fff; box-shadow:0 0 12px rgba(0,255,213,.5); }
  .cand-b.used{ color:#41626e; border-color:#1e3540; background:rgba(255,255,255,.02); text-decoration:line-through; }
  .cand-b.right{ color:#0a1200; background:linear-gradient(135deg,var(--gold),#ffb347); border-color:var(--gold);
    font-weight:700; text-decoration:none; box-shadow:0 0 16px rgba(255,215,0,.6); }
  .cand-b:disabled{ cursor:default; }

  .guess-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .guess-row input{ flex:1; min-width:150px; }
  .q-foot{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:4px; }
  .q-count{ font-size:.74rem; color:var(--dim); }

  /* 属性对照棋盘 */
  .tbl-wrap{ overflow-x:auto; margin-top:12px; -webkit-overflow-scrolling:touch; }
  table.board{ border-collapse:separate; border-spacing:4px; font-size:.76rem; margin:0 auto; }
  table.board th{ color:var(--dim); font-weight:400; font-size:.7rem; letter-spacing:.06em; padding:2px 6px; white-space:nowrap; }
  table.board td{ padding:6px 9px; border-radius:5px; text-align:center; white-space:nowrap;
    border:1px solid #24384a; color:#cff; background:rgba(255,255,255,.035); }
  td.hit{ border-color:var(--neon); color:#001a15; background:var(--neon); text-shadow:none; font-weight:700;
    box-shadow:0 0 12px rgba(0,255,213,.5); }
  td.part{ border-color:var(--gold); color:var(--gold); background:rgba(255,215,0,.14); }
  td.up,td.down{ border-color:rgba(0,255,213,.6); color:var(--neon); background:rgba(0,255,213,.12); }
  td.miss{ border-color:#2a3340; color:#5f7d8a; background:rgba(255,255,255,.02); }
  td.name{ color:#fff; border-color:rgba(255,0,229,.45); background:rgba(255,0,229,.1); font-weight:700; }

  .ans{ margin-top:14px; padding:14px; border:1px solid rgba(255,215,0,.55); border-radius:10px;
    background:linear-gradient(150deg, rgba(255,215,0,.12), rgba(255,0,229,.07)); text-align:center;
    box-shadow:0 0 24px rgba(255,215,0,.16); }
  .ans .a{ font-size:1.25rem; color:var(--gold); text-shadow:0 0 14px rgba(255,215,0,.7); letter-spacing:.08em; }
  .ans .n{ font-size:.8rem; color:#cfe8; margin-top:6px; }
  .ans .s{ font-size:.85rem; color:var(--neon); margin-top:8px; letter-spacing:.1em; }
  .share-bar{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
  .sum{ text-align:center; padding:20px; border:1px solid rgba(255,215,0,.5); border-radius:12px;
    background:linear-gradient(160deg, rgba(30,20,0,.6), rgba(16,4,26,.7));
    box-shadow:0 0 30px rgba(255,215,0,.16); margin:22px 0; }
  .sum .big{ font-size:clamp(1.6rem,7vw,2rem); color:var(--gold); text-shadow:0 0 18px rgba(255,215,0,.7); letter-spacing:.06em; }
  .sum .line{ font-size:.82rem; color:#cfe8; margin-top:8px; letter-spacing:.08em; }

  /* ── 窄屏（重做） ── */
  @media (max-width:680px){
    .pz-head{ margin-bottom:4px; }
    .pz-tabs{ gap:6px; margin:12px -12px 4px; padding:0 12px 4px; overflow-x:auto;
      -webkit-overflow-scrolling:touch; flex-wrap:nowrap; justify-content:flex-start; scrollbar-width:none; }
    .pz-tabs::-webkit-scrollbar{ display:none; }
    .pz-tabs .btn{ flex:0 0 auto; }
    .pz-tabs #whoami{ display:none; }              /* 登录态已在顶部导航显示，手机上省一行 */
    .qcard{ padding:13px 11px; margin:12px 0; border-radius:10px; }
    .qcard::before,.qcard::after{ width:12px; height:12px; }
    .q-h{ gap:6px; margin-bottom:9px; }
    .q-idx{ font-size:.88rem; }
    .q-body{ margin-bottom:10px; }
    .q-img{ max-width:100%; border-radius:8px; }
    .q-riddle{ font-size:.9rem; line-height:1.95; padding:11px 12px; }
    .cand{ max-height:132px; gap:5px; padding:7px; }
    .cand-b{ font-size:.72rem; padding:7px 10px; }
    .q-foot{ gap:7px; }
    .q-foot .btn.sm{ flex:0 0 auto; }
    .q-foot .inp{ flex:1 1 100%; }
    table.board{ font-size:.66rem; } table.board td{ padding:5px 6px; }
    table.board th{ font-size:.62rem; padding:1px 4px; }
    .ans .a{ font-size:1.1rem; }
    .sum{ padding:16px 12px; }
    .share-bar .btn{ flex:1 1 auto; }
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="nav"></div>

<div class="page">
  <div class="pz-head">
    <h1 class="title">🧩 每日谜题</h1>
    <div class="pz-meta" id="meta">加载中…</div>
    <div class="pz-tabs">
      <a class="btn ghost sm" href="/puzzle/archive">📅 往期归档</a>
      <a class="btn ghost sm" href="/puzzle/leaderboard">🏆 排行榜</a>
      <span class="btn ghost sm" id="whoami">…</span>
    </div>
  </div>

  <div id="notice"></div>
  <div id="questions"><div class="loading">题库加载中</div></div>
  <div id="summary"></div>

  <div class="panel gold mt24">
    <h3>玩法</h3>
    <div class="muted" style="line-height:1.9">
      · 每天 <b class="gold">2 题</b>，北京时间 0 点换题：一枚「属性对照」+ 一枚「图像 / 绘画 / 文字」线索。<br>
      · <b class="gold">未登录也能玩</b>，登录后成绩才计入榜单（<a href="/forum/login?next=%2Fpuzzle%2F">去登录</a>）。<br>
      · 计分：猜中 <b class="gold">+100</b>，每错一次 <b class="gold">-15</b>（单题最低 40）；连续天数每天 <b class="gold">+10%</b> 连击加成，上限 +100%。<br>
      · 属性对照：<span class="cyan">✓ 命中</span> / <span class="cyan">↑ 答案更大</span> / <span class="cyan">↓ 答案更小</span> / <span class="gold">◐ 部分命中</span> / <span class="dimc">✗ 不匹配</span>。
    </div>
  </div>
</div>

<footer>Copyright © yygq面馆 · <b>港ICP备00000001号</b></footer>

<script src="/assets/common.js"></script>
<script src="/assets/puzzle-engine.js"></script>
<script>
YQ.boot('puzzle');
var P = YQ.puzzle;
var DAY = YQ.qs('d','') || P.today();
var IS_TODAY = (DAY === P.today());
var LABEL = { attr:'属性对照', image:'图像线索', draw:'绘画线索', riddle:'文字谜语' };
/* 分类名只描述领域，不描述答案类型 —— 只有 attr 题才一定是人物 */
var CATNAME = { anime:'动漫', game:'游戏', esports:'电竞', sports:'体育' };
var POOLS = {};
var STATE = [];   /* 每题：{q, wrong, solved, rows:[], busy} */

function saveLocal(){
  var total = STATE.reduce(function(s,x){ return s + (x.solved ? P.finalScore(x.wrong, streak()) : 0); }, 0);
  P.local.save(DAY, {
    total: total,
    items: STATE.map(function(x){ return { id:x.q.id, wrong:x.wrong, solved:x.solved, sent:!!x.sent }; }),
    at: Date.now()
  });
}
function streak(){ return P.localStreak(DAY) + 1; }

/* ---------------- 渲染 ---------------- */
function renderMeta(players){
  var s = streak();
  document.getElementById('meta').innerHTML = DAY + ' · ' + (IS_TODAY ? '今日' : '往期回顾') +
    ' · 连击 <b>x' + s + '</b>' + (players != null ? ' · 今日 <b>' + players + '</b> 人参与' : '') +
    (IS_TODAY ? '' : ' · 往期不计入当日榜');
}

function cardShell(x, idx){
  var q = x.q;
  var cls = 'qcard' + (idx ? ' pink' : '') + (x.solved ? ' done' : '');
  return '<div class="' + cls + '" id="card-' + q.id + '">' +
    '<div class="q-h"><span class="q-idx">第 ' + (idx + 1) + ' 题</span>' +
    '<span class="badge">' + (LABEL[q.type] || q.type) + '</span>' +
    '<span class="badge pink">' + (CATNAME[q.cat] || q.cat || '') + '</span>' +
    '<span class="q-count" id="cnt-' + q.id + '"></span></div>' +
    '<div class="q-body" id="body-' + q.id + '"></div>' +
    '<div class="q-foot" id="foot-' + q.id + '"></div>' +
    '<div id="hist-' + q.id + '"></div>' +
    '<div id="ans-' + q.id + '"></div></div>';
}

function renderQuestion(x, idx){
  var q = x.q;
  var body = document.getElementById('body-' + q.id);
  var foot = document.getElementById('foot-' + q.id);
  var hist = document.getElementById('hist-' + q.id);
  if (!body) return;

  if (q.type === 'attr') {
    var pool = POOLS[q.cat];
    if (pool === null) {
      body.innerHTML = '<div class="empty"><span class="big">⚠</span>属性池加载失败' +
        '<span class="sub">刷新页面重试；其他题型不受影响</span></div>';
      foot.innerHTML = '';
      return;
    }
    if (!pool) { body.innerHTML = '<div class="loading">属性池加载中</div>'; return; }
    hist.innerHTML = '';   /* 表头由 drawBoard 统一渲染 */
    var opts = [];
    pool.entities.forEach(function(e){
      opts.push('<option value="' + YQ.esc(e.name) + '">');
      (e.aliases||[]).forEach(function(a){ opts.push('<option value="' + YQ.esc(a) + '">'); });
    });
    body.innerHTML = '<div class="muted mb8">猜一个' + (CATNAME[q.cat]||'') +
      '人物：每次提交会逐字段反馈（✓ 相等 / ↑ 答案更大 / ↓ 答案更小 / ◐ 部分命中 / ✗ 不符）。<br>' +
      '<span class="dimc">手机可以直接点下面的候选，不用打字。</span></div>' +
      '<datalist id="dl-' + q.id + '">' + opts.join('') + '</datalist>' +
      '<div class="cand-h">候选 <b>' + pool.entities.length + '</b> 位（都是人物）· 点一下就猜'
      + (q.hint ? '' : '') + '</div>' +
      '<div class="cand" id="cand-' + q.id + '">' +
      pool.entities.map(function(e){
        return '<button type="button" class="cand-b" data-n="' + YQ.esc(e.name) + '">' + YQ.esc(e.name) + '</button>';
      }).join('') + '</div>';
    foot.innerHTML = '<input class="inp" id="in-' + q.id + '" list="dl-' + q.id + '" placeholder="输入名字或别名，回车提交" autocomplete="off">' +
      '<button class="btn sm fix" id="go-' + q.id + '">提交猜测</button>' +
      (q.hint ? '<button class="btn ghost sm fix" id="hint-' + q.id + '">💡 提示</button>' : '') +
      '<span class="q-count" id="hw-' + q.id + '">已猜 0 次</span>';
  } else if (q.type === 'image' || q.type === 'draw') {
    body.innerHTML = '<div class="muted mb8 center">' +
      (q.type === 'draw' ? '这是一幅简笔画，猜猜画的是什么（人物 / 作品 / 物品均可）' : '看图猜答案：可能是人物、项目、术语或物品（剪影 / 局部 / 像素化 / 抽象轮廓）') + '</div>' +
      '<img class="q-img" src="' + YQ.esc(q.image) + '" alt="谜题图片" loading="lazy">';
    foot.innerHTML = '<input class="inp" id="in-' + q.id + '" placeholder="输入你的答案，回车提交" autocomplete="off">' +
      '<button class="btn sm fix" id="go-' + q.id + '">提交猜测</button>' +
      (q.hint ? '<button class="btn ghost sm fix" id="hint-' + q.id + '">💡 提示</button>' : '') +
      '<span class="q-count" id="hw-' + q.id + '">已猜 0 次</span>';
  } else {
    body.innerHTML = '<div class="muted mb8 center">答案可能是人物、作品、术语或物品</div>' +
      '<div class="q-riddle">' + YQ.escBr(q.text) + '</div>';
    foot.innerHTML = '<input class="inp" id="in-' + q.id + '" placeholder="输入答案（支持别名），回车提交" autocomplete="off">' +
      '<button class="btn sm fix" id="go-' + q.id + '">提交猜测</button>' +
      (q.hint ? '<button class="btn ghost sm fix" id="hint-' + q.id + '">💡 提示</button>' : '') +
      '<span class="q-count" id="hw-' + q.id + '">已猜 0 次</span>';
  }

  var inp = document.getElementById('in-' + q.id);
  var go = document.getElementById('go-' + q.id);
  if (go) go.onclick = function(){ submit(x, idx); };
  if (inp) inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') submit(x, idx); });
  var hb = document.getElementById('hint-' + q.id);
  if (hb) hb.onclick = function(){ hb.outerHTML = '<span class="q-hintbox">💡 ' + YQ.esc(q.hint) + '</span>'; };
  /* 候选点选：手机友好，点一下即提交 */
  var cand = document.getElementById('cand-' + q.id);
  if (cand) {
    cand.onclick = function(ev){
      var b = ev.target.closest ? ev.target.closest('.cand-b') : null;
      if (!b || x.solved) return;
      if (inp) inp.value = b.getAttribute('data-n');
      submit(x, idx);
    };
  }

  if (q.type === 'attr') drawBoard(x);   /* 先画出表头（此时还没猜过） */
  updateCount(x);
  markCandidates(x);
  if (x.solved) showAnswer(x, idx, !IS_TODAY);
}

/* 把猜过的候选置灰、命中项高亮 */
function markCandidates(x){
  var box = document.getElementById('cand-' + x.q.id);
  if (!box) return;
  var guessed = {};
  x.rows.forEach(function(r){ guessed[r.name] = true; });
  YQ.$$('.cand-b', box).forEach(function(b){
    var n = b.getAttribute('data-n');
    b.classList.toggle('used', !!guessed[n]);
    b.classList.toggle('right', x.solved && n === x.q.answer);
    b.disabled = x.solved;
  });
}

function updateCount(x){
  var el = document.getElementById('cnt-' + x.q.id);
  if (el) el.textContent = x.solved ? '已解开' : (x.wrong ? ('错 ' + x.wrong + ' 次') : '');
  var hw = document.getElementById('hw-' + x.q.id);
  if (hw) hw.textContent = '已猜 ' + x.guesses + ' 次';
}

/* 服务端记账：每次猜测镜像到 /api/puzzle/guess（登录后有效；排队保证交卷时已入账） */
var MIRS = Promise.resolve();
function mirrorGuess(qid, guess){
  if (!IS_TODAY || !YQ.user) return;
  MIRS = MIRS.then(function(){
    return YQ.api('/api/puzzle/guess', { method:'POST', timeout: 12000,
      body:{ day: DAY, qid: qid, guess: guess } }).catch(function(){});
  });
}

/* ---------------- 提交 ---------------- */
function submit(x, idx){
  var q = x.q;
  var inp = document.getElementById('in-' + q.id);
  var val = (inp && inp.value || '').trim();
  if (!val) { YQ.toast('先输入答案'); return; }
  if (x.solved) { YQ.toast('这题已经拿下啦'); return; }
  if (x.busy) return;
  x.busy = true;

  if (q.type === 'attr') {
    var pool = POOLS[q.cat];
    var ge = P.resolveEntity(val, pool);
    if (!ge) { x.busy = false; YQ.toast('不在候选名单里，换一个试试', true); return; }
    var ae = null;
    pool.entities.forEach(function(e){ if (e.name === q.answer) ae = e; });
    if (!ae) { x.busy = false; YQ.toast('题库异常：找不到答案实体', true); return; }
    mirrorGuess(q.id, ge.name);
    var row = P.compareRow(pool, ge, ae);
    x.guesses++;
    x.rows.unshift({ name: ge.name, cells: row });
    drawBoard(x);
    markCandidates(x);
    if (ge.name === q.answer) { solved(x, idx); }
    else { x.wrong++; afterWrong(x); }
    x.busy = false;
    if (inp) inp.value = '';
    return;
  }

  var guess = val;
  mirrorGuess(q.id, guess);
  x.guesses++;
  var ok = P.match(guess, q, null);
  x.lastGuess = guess;
  x.busy = false;
  if (ok) { solved(x, idx); } else { x.wrong++; afterWrong(x); }
  if (inp) inp.value = '';
}

function afterWrong(x){
  updateCount(x);
  var box = document.getElementById('hist-' + x.q.id);
  if (box && x.q.type !== 'attr') {
    var line = '<div class="muted mt8">✗ 「' + YQ.esc(x.lastGuess) + '」不对，再想想</div>';
    box.insertAdjacentHTML('afterbegin', line);
    var all = box.querySelectorAll('div.muted');
    for (var i = 12; i < all.length; i++) all[i].remove();
  }
  saveLocal();
  YQ.toast('不对哦，再试试（-' + P.CONFIG.PENALTY + '）', true);
}

/* 历史上猜测棋盘：整块重绘（≤12 行，开销可忽略）。
   刻意不用 insertRow/rows/deleteRow 这套老表格 API —— 直接拼 HTML 更简单、
   在任何 DOM 实现下行为一致（也顺便让无浏览器的 UI 测试能跑通）。 */
function drawBoard(x){
  var wrap = document.getElementById('hist-' + x.q.id);
  var pool = POOLS[x.q.cat];
  if (!wrap || !pool) return;
  var head = '<tr><th></th>' + pool.fields.map(function(f){ return '<th>' + YQ.esc(f.k) + '</th>'; }).join('') + '</tr>';
  var body = x.rows.slice(0, 12).map(function(r){
    return '<tr><td class="name">' + YQ.esc(r.name) + '</td>' +
      r.cells.map(function(c){ return '<td class="' + YQ.esc(c.state) + '">' + YQ.esc(c.txt) + '</td>'; }).join('') + '</tr>';
  }).join('');
  wrap.innerHTML = '<div class="scroll-hint">← 左右滑动看全部字段 →</div>' +
    '<div class="tbl-wrap"><table class="board" id="tbl-' + x.q.id + '">' + head + body + '</table></div>';
}

function solved(x, idx){
  x.solved = true;
  markCandidates(x);
  var gain = P.finalScore(x.wrong, streak());
  x.gain = gain;
  updateCount(x);
  var card = document.getElementById('card-' + x.q.id);
  if (card) card.classList.add('done');
  showAnswer(x, idx, false);
  saveLocal();
  submitResult(x);
  checkAllDone();
}

function showAnswer(x, idx, replay){
  var q = x.q;
  var box = document.getElementById('ans-' + q.id);
  if (!box || box.innerHTML) return;
  var gain = x.gain != null ? x.gain : P.finalScore(x.wrong, streak());
  var emoji = x.wrong === 0 ? '🟩' : (x.wrong <= 2 ? '🟨' : '🟥');
  box.innerHTML = '<div class="ans"><div>答案</div><div class="a">' + YQ.esc(q.answer) + '</div>' +
    '<div class="n">' + YQ.esc(q.note || '') + '</div>' +
    '<div class="s">' + emoji + ' ' + (replay ? '（往期回顾）' : '') + '猜了 ' + (x.guesses||0) + ' 次 · 错 ' + x.wrong +
    ' 次 · 得分 ' + gain + '</div>' +
    ((q.aliases && q.aliases.length) ? '<div class="n">其他写法：' + YQ.esc(q.aliases.join(' / ')) + '</div>' : '') +
    '</div>';
  var foot = document.getElementById('foot-' + q.id);
  if (foot && x.solved) {
    foot.innerHTML = '<span class="q-count">✅ 已解开（' + gain + ' 分' +
      (x.fromServer && gain > 0 ? ' · 已计入榜单' : '') + '）</span>';
  }
}

/* 后端在线时把成绩交给服务端（服务端重算分数，客户端改不了） */
function submitResult(x, retried){
  if (!IS_TODAY) return;
  if (!YQ.user) return;
  var qid = x.q.id;
  MIRS.then(function(){
    return YQ.api('/api/puzzle/result', { method:'POST', timeout: 12000,
      body:{ day: DAY, qid: qid, wrong: x.wrong, solved: 1 } });
  }).then(function(r){
    if (!r.ok || !r.data || r.data.score == null) {
      if (!retried) { setTimeout(function(){ submitResult(x, true); }, 2500); return; }
      YQ.toast((r && r.msg) ? ('成绩同步失败：' + r.msg) : '成绩同步没成功，刷新后再试一次', true);
      return;
    }
    x.gain = r.data.score;
    x.sent = true;
    saveLocal();
    var box = document.getElementById('ans-' + qid);
    if (box) {
      var s = box.querySelector('.s');
      if (s) {
        var mark = r.data.already ? '（今日已交卷，成绩不变）' : (r.data.solved ? '（已计入榜单）' : '（未判定为解出，再来一次）');
        s.textContent = s.textContent.replace(/得分 \d+/, '得分 ' + r.data.score + mark);
      }
    }
    if (r.data.solved === 0) YQ.toast('服务端没看到关键的猜中记录，这题成绩未确认', true);
    checkAllDone();
  }).catch(function(){
    if (!retried) { setTimeout(function(){ submitResult(x, true); }, 2500); return; }
    YQ.toast('成绩同步没成功，刷新后再试一次', true);
  });
}

function checkAllDone(){
  if (!STATE.length || !STATE.every(function(x){ return x.solved; })) return;
  var total = STATE.reduce(function(s, x){ return s + (x.gain != null ? x.gain : P.finalScore(x.wrong, streak())); }, 0);
  var s = streak();
  var box = document.getElementById('summary');
  if (box.dataset.shown) { updateSummary(total, s); return; }
  box.dataset.shown = '1';
  box.innerHTML = '<div class="sum"><div class="muted">今日战绩</div><div class="big" id="sumTotal">' + total + ' 分</div>' +
    '<div class="line" id="sumLine"></div>' +
    '<div class="share-bar"><button class="btn gold sm" id="shareBtn">📋 复制战绩</button>' +
    '<a class="btn ghost sm" href="/puzzle/leaderboard">🏆 看榜单</a>' +
    '<a class="btn ghost sm" href="/puzzle/archive">📅 玩往期</a></div></div>';
  updateSummary(total, s);
  document.getElementById('shareBtn').onclick = function(){
    var rows = STATE.map(function(x){
      return { label: LABEL[x.q.type] || x.q.type, wrong: x.wrong, done: x.solved,
        gain: x.gain != null ? x.gain : P.finalScore(x.wrong, s),
        emoji: x.wrong === 0 ? '🟩🟩🟩' : (x.wrong <= 2 ? '🟨🟨⬜' : '🟥⬜⬜') };
    });
    YQ.copy(P.shareText(DAY, rows, total, s));
  };
}
function updateSummary(total, s){
  var t = document.getElementById('sumTotal'); if (t) t.textContent = total + ' 分';
  var l = document.getElementById('sumLine');
  if (l) l.innerHTML = STATE.map(function(x){
    return (LABEL[x.q.type]||'') + ' ' + (x.wrong===0?'🟩':(x.wrong<=2?'🟨':'🟥')) + ' ' + x.wrong + '错';
  }).join(' · ') + ' · 连击 x' + s + (YQ.user ? '' : ' · <a href="/forum/login?next=%2Fpuzzle%2F">登录后上榜</a>');
}

/* ---------------- 启动 ---------------- */
YQ.me(true).then(function(u){
  var el = document.getElementById('whoami');
  if (el) el.textContent = u ? ('代表 ' + u) : '未登录（可玩，不上榜）';
  /* 服务端成绩（跨设备防重玩）：今日已交卷的题目从服务端取回，本地存档只是缓存 */
  var mineP = (u && IS_TODAY)
    ? YQ.api('/api/puzzle/today?d=' + DAY).then(function(r){ return (r.ok && r.data && r.data.mine) || []; }).catch(function(){ return []; })
    : Promise.resolve([]);
  return Promise.all([P.load(), mineP]);
}).then(function(arr){
  var bank = arr[0], MINE = arr[1] || [];
  var qs = P.pickDaily(bank, DAY);
  if (!qs.length) { YQ.empty('#questions', '题库还是空的', '把题目放进 bank/ 即可', '🧩'); return; }
  STATE = qs.map(function(q){ return { q:q, wrong:0, solved:false, rows:[], guesses:0, busy:false, gain:null, fromServer:false, sent:false }; });

  /* 恢复本地进度（刷新不丢；只有「已同步到服务端」的才锁定，未同步的可重玩重传） */
  var saved = P.local.get(DAY);
  if (saved && saved.items) {
    saved.items.forEach(function(it){
      STATE.forEach(function(x){
        if (x.q.id === it.id && it.solved && it.sent === true) { x.wrong = it.wrong; x.guesses = it.wrong + 1; x.solved = true; x.gain = P.finalScore(it.wrong, streak()); }
      });
    });
  }

  /* 服务端成绩覆盖（更权威）：已交卷的题锁定，换设备也不能重玩 */
  MINE.forEach(function(it){
    STATE.forEach(function(x){
      if (x.q.id !== it.qid) return;
      x.solved = true; x.fromServer = true; x.sent = true;
      x.wrong = it.wrong | 0; x.guesses = (it.wrong | 0) + 1;
      x.gain = it.score | 0;
    });
  });

  document.getElementById('questions').innerHTML = STATE.map(cardShell).join('');

  /* 属性池按需加载（只加载用到的分类） */
  var need = {};
  STATE.forEach(function(x){ if (x.q.type === 'attr') need[x.q.cat] = 1; });
  var jobs = Object.keys(need).map(function(cat){
    return P.pool(cat).then(function(p){ POOLS[cat] = p; }).catch(function(){ POOLS[cat] = null; });
  });
  Promise.all(jobs).then(function(){
    STATE.forEach(renderQuestion);
    if (!IS_TODAY) {
      document.getElementById('notice').innerHTML =
        '<div class="msg show warn">你在看 <b>' + YQ.esc(DAY) + '</b> 的往期谜题（不计入当日榜）。' +
        '<a href="/puzzle/">回到今日谜题 ›</a></div>';
    }
    checkAllDone();
  });

  YQ.api('/api/puzzle/stats?day=' + DAY).then(function(r){
    renderMeta(r.ok ? (r.data.players || 0) : null);
  });
}).catch(function(e){
  YQ.empty('#questions', '题库加载失败', (e && e.message) || '请刷新重试', '⚠');
});
</script>
